<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Blenderize</title>
  <meta name="description"
    content="Blenderize. A game where you combine colored blocks together." />
  <link href="/global.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="icon" type="image/x-icon" href="/favicon-32.png" />

</head>

<body class="background">
  <header class="header middleground">
    <h1 id="title" class="title">
      Blenderize
    </h1>
    <a class="toggle" href="javascript:toggleColorScheme(changeDarkmode());">
          <span id="icon-sun">☼</span>
          <span id="icon-moon">☽</span>
    </a>
  </header>

  <div class="container">
    <div id="game" class="middleground">
    </div>
  
    <div id="controls" class="middleground">
      <div class="controls-btn foreground" onclick="controls(0)">⇦</div>
      <div class="controls-btn foreground" onclick="controls(1)">⇧</div>
      <div class="controls-btn foreground" onclick="controls(2)">⇨</div>
      <div class="controls-btn foreground" onclick="controls(3)">⇩</div>
      <div class="controls-btn foreground" onclick="controls(4)">↶</div>
  
    </div>
  
    <div class="movesCountText">
      <span id="movesCount">0</span>
      Moves
    </div>
  
    <div id="history" class="middleground">
    </div>
  </div>




  <script src="/darkmode.js"></script>
  <script src="script.js"></script>

</body>

</html>
